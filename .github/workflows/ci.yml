name: Verify LeadFlow
on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.19"
      - run: uv sync --locked
        working-directory: backend
      - run: uv run ruff check app migrations scripts tests
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run alembic check
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workflow-evidence
          path: |
            docs/screenshots
            frontend/test-results
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leadflow
          POSTGRES_PASSWORD: leadflow
          POSTGRES_DB: leadflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadflow -d leadflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://leadflow:leadflow@localhost:5432/leadflow
      LOCAL_DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.19"
      - run: uv sync --locked
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
      - run: uv run alembic check
        working-directory: backend
      - run: uv run python scripts/check_postgres.py
        working-directory: backend
